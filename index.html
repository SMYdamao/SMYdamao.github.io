<!doctype html>
<html lang="zh-CN">
<head>

      color: #1f2933;

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;

      color: #4b5563;
    }

    a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }

<body>
  <main>
    <h1>截图-拼图工具</h1>
    <p>
      截图-拼图工具是一款用于网页截图、长图生成、图片拼接与 PDF 处理的实用工具。

    <p>
      如需了解隐私与数据处理说明，请查看
